(()=>{const form=document.getElementById('unlock-form'),btn=document.getElementById('submit'),input=document.getElementById('answer'),error=document.getElementById('err');const dec=v=>Uint8Array.from(atob(v),x=>x.charCodeAt(0));const cat=(a,b)=>{const out=new Uint8Array(a.length+b.length);out.set(a);out.set(b,a.length);return out};form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='正在解密…';error.textContent='';try{const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value.normalize('NFC')),'PBKDF2',false,['deriveBits']);const derived=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:dec(vault.salt),iterations:vault.n,hash:'SHA-256'},key,512));const ct=dec(vault.data),iv=dec(vault.iv),auth=await crypto.subtle.importKey('raw',derived.slice(32),{name:'HMAC',hash:'SHA-256'},false,['verify']);if(!await crypto.subtle.verify('HMAC',auth,dec(vault.tag),cat(iv,ct)))throw Error('wrong');const aes=await crypto.subtle.importKey('raw',derived.slice(0,32),'AES-CTR',false,['decrypt']);const binary=await crypto.subtle.decrypt({name:'AES-CTR',counter:iv,length:64},aes,ct);const doc=new TextDecoder().decode(binary);if(!doc.startsWith('<!DOCTYPE html>'))throw Error('invalid');document.open();document.write(doc);document.close()}catch(e){error.textContent='答案不正确，或浏览器不支持解密。';input.select()}finally{btn.disabled=false;btn.textContent='解锁研究内容'}})})();
