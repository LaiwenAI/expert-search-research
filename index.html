(function(){const form=document.getElementById('gate-form'),btn=document.getElementById('unlock'),answer=document.getElementById('answer'),err=document.getElementById('error'),dec=s=>Uint8Array.from(atob(s),x=>x.charCodeAt(0));const concat=(a,b)=>{const c=new Uint8Array(a.length+b.length);c.set(a);c.set(b,a.length);return c};form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;err.textContent='';btn.textContent='正在解密…';try{if(!crypto.subtle)throw Error('unsupported');const pass=new TextEncoder().encode(answer.value.normalize('NFC'));const base=await crypto.subtle.importKey('raw',pass,'PBKDF2',false,['deriveBits']);const raw=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:dec(vault.salt),iterations:vault.n,hash:'SHA-256'},base,512));const iv=dec(vault.iv),ct=dec(vault.data);const hmac=await crypto.subtle.importKey('raw',raw.slice(32),{name:'HMAC',hash:'SHA-256'},false,['verify']);const ok=await crypto.subtle.verify('HMAC',hmac,dec(vault.tag),concat(iv,ct));if(!ok)throw Error('password');const aes=await crypto.subtle.importKey('raw',raw.slice(0,32),'AES-CTR',false,['decrypt']);const bytes=await crypto.subtle.decrypt({name:'AES-CTR',counter:iv,length:64},aes,ct);let html=new TextDecoder('utf-8',{fatal:true}).decode(bytes);if(!html.startsWith('<!DOCTYPE html>'))throw Error('invalid');document.open();document.write(html);document.close()}catch(ex){err.textContent=ex.message==='unsupported'?'请使用支持安全加密的现代浏览器访问。':'答案不正确，请重新输入。';answer.select()}finally{btn.disabled=false;btn.textContent='解锁研究内容'}})})();</script></body></html>
