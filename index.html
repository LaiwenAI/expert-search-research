(function(){
const form=document.getElementById('gate-form'),btn=document.getElementById('unlock'),answer=document.getElementById('answer'),err=document.getElementById('error');
const dec=s=>Uint8Array.from(atob(s),x=>x.charCodeAt(0));
const enc=a=>btoa(String.fromCharCode(...a));
const concat=(a,b)=>{const c=new Uint8Array(a.length+b.length);c.set(a);c.set(b,a.length);return c};
const sessionKey='expert-search-unlock:'+vault.tag;
function readSession(){try{return sessionStorage.getItem(sessionKey)}catch{return null}}
function writeSession(value){try{sessionStorage.setItem(sessionKey,value)}catch{}}
function clearSession(){try{sessionStorage.removeItem(sessionKey)}catch{}}
async function decryptDocument(raw,remember){
  if(!crypto.subtle)throw Error('unsupported');
  const iv=dec(vault.iv),ct=dec(vault.data);
  const hmac=await crypto.subtle.importKey('raw',raw.slice(32,64),{name:'HMAC',hash:'SHA-256'},false,['verify']);
  if(!await crypto.subtle.verify('HMAC',hmac,dec(vault.tag),concat(iv,ct)))throw Error('password');
  const aes=await crypto.subtle.importKey('raw',raw.slice(0,32),'AES-CTR',false,['decrypt']);
  const bytes=await crypto.subtle.decrypt({name:'AES-CTR',counter:iv,length:64},aes,ct);
  let html=new TextDecoder('utf-8',{fatal:true}).decode(bytes);
  if(!html.startsWith('<!DOCTYPE html>'))throw Error('invalid');
  html=html.replace('</head>',"<style id=\"reader-layout-fix\">\n.reader-toolbar{position:fixed!important;inset:0 0 auto 0!important;width:100%!important;max-width:none!important;margin:0!important;min-height:44px!important;padding:4px max(18px,calc((100vw - 1220px)/2))!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;flex-wrap:nowrap!important;box-sizing:border-box!important;z-index:1000!important}\n.reader-brand{flex:0 1 auto!important;min-width:0!important;white-space:nowrap!important}\n.reader-controls{display:flex!important;flex-direction:row!important;align-items:center!important;gap:6px!important;flex:0 0 auto!important;white-space:nowrap!important}\n.reader-meta{white-space:nowrap!important;word-break:normal!important;writing-mode:horizontal-tb!important;min-width:max-content!important}\n.reader-btn{width:auto!important;white-space:nowrap!important;writing-mode:horizontal-tb!important}\n.reading-shell{padding-top:44px!important}\n.reader-backtop{position:fixed!important;left:auto!important;top:auto!important;right:22px!important;bottom:22px!important;width:auto!important;max-width:none!important;writing-mode:horizontal-tb!important;white-space:nowrap!important;z-index:1000!important}\n@media(max-width:640px){.reader-toolbar{padding:4px 12px!important;gap:6px!important}.reading-shell{padding-top:44px!important}.reader-meta{display:none!important}.reader-brand{max-width:110px!important}.reader-controls{gap:4px!important}.reader-backtop{right:12px!important;bottom:12px!important}}\n@media print{.reader-toolbar,.reader-backtop{display:none!important}.reading-shell{padding-top:0!important}}\n</style>"+'</head>');
  if(remember)writeSession(enc(raw));
  // Async decryption must replace the document root, not document.write into the gate.
  const parsed=new DOMParser().parseFromString(html,'text/html');
  if(!parsed.querySelector('.reading-shell')||!parsed.querySelector('.reader-toolbar'))throw Error('invalid');
  const nextRoot=document.importNode(parsed.documentElement,true);
  document.replaceChild(nextRoot,document.documentElement);
  // DOMParser keeps scripts inert. Recreate them in source order to initialize navigation,
  // figures, controls, and Giscus in the decrypted document.
  for(const inert of Array.from(document.querySelectorAll('script'))){
    const live=document.createElement('script');
    for(const attr of Array.from(inert.attributes))live.setAttribute(attr.name,attr.value);
    if(!inert.hasAttribute('src'))live.textContent=inert.textContent;
    inert.replaceWith(live);
  }
}
form.addEventListener('submit',async e=>{
  e.preventDefault();btn.disabled=true;err.textContent='';btn.textContent='正在解密…';
  try{
    if(!crypto.subtle)throw Error('unsupported');
    const pass=new TextEncoder().encode(answer.value.normalize('NFC'));
    const base=await crypto.subtle.importKey('raw',pass,'PBKDF2',false,['deriveBits']);
    const raw=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:dec(vault.salt),iterations:vault.n,hash:'SHA-256'},base,512));
    await decryptDocument(raw,true);
  }catch(ex){
    err.textContent=ex.message==='unsupported'?'请使用支持安全加密的现代浏览器访问。':'答案不正确，请重新输入。';
    answer.select();
  }finally{btn.disabled=false;btn.textContent='解锁研究内容'}
});
const saved=readSession();
if(saved){
  btn.disabled=true;btn.textContent='正在恢复本次会话…';
  (async()=>{try{const raw=dec(saved);if(raw.length!==64)throw Error('invalid');await decryptDocument(raw,false)}
    catch{clearSession();btn.disabled=false;btn.textContent='解锁研究内容';err.textContent='本次会话已失效，请重新输入答案。'}
  })();
}
})();</script></body></html>
